<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autonomy Map</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @media print {
      body { background: white !important; }
      .no-print { display: none !important; }
      .print-border { border: 1px solid #cbd5e1 !important; }
    }
  </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans pb-16">
  <div id="app" class="max-w-7xl mx-auto p-4 md:p-6">

    <!-- LOBBY / RAUM-EINGABE -->
    <div v-if="!currentRoom" class="max-w-md mx-auto mt-20 bg-white p-8 rounded-2xl shadow-xl border border-slate-100">
      <h1 class="text-3xl font-bold text-center text-slate-800 mb-2">🧭 Autonomy Map</h1>
      <p class="text-slate-500 text-sm text-center mb-6">Kollaborative Entscheidungsmatrix</p>
      
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Raum-Code</label>
          <input v-model="roomInput" @keyup.enter="joinRoom(roomInput)" type="text" placeholder="z. B. MAP-123" class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none uppercase font-mono text-center tracking-widest text-lg font-bold">
        </div>
        <button @click="joinRoom(roomInput)" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-lg transition shadow-md">Raum betreten</button>
        <button @click="createRandomRoom" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-3 rounded-lg transition">Zufälligen Raum erstellen</button>
      </div>
    </div>

    <!-- HAUPTANSICHT DER MAP -->
    <div v-else class="space-y-6">
      
      <!-- TOP-BAR (im Druck ausgeblendet) -->
      <header class="flex flex-wrap items-center justify-between bg-white p-4 rounded-xl shadow-sm border border-slate-200 gap-4 no-print">
        <div>
          <h1 class="text-2xl font-bold flex items-center gap-2">
            🧭 Autonomy Map <span class="text-xs bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded font-mono font-normal">Raum: {{ currentRoom }}</span>
          </h1>
          <p class="text-xs text-slate-500 mt-1">Änderungen werden live synchronisiert.</p>
        </div>

        <!-- EXPORT & IMPORT BUTTONS -->
        <div class="flex flex-wrap items-center gap-2">
          <!-- Backup Import (JSON) -->
          <label class="cursor-pointer bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs px-3 py-2 rounded-lg font-medium transition flex items-center gap-1 border border-slate-300">
            📂 Backup laden (JSON)
            <input type="file" accept=".json" class="hidden" @change="importJsonBackup">
          </label>

          <!-- Backup Export (JSON) -->
          <button @click="exportJsonBackup" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs px-3 py-2 rounded-lg font-medium transition flex items-center gap-1 border border-slate-300">
            💾 Backup speichern (JSON)
          </button>

          <!-- Markdown Export -->
          <button @click="exportMarkdown" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs px-3 py-2 rounded-lg font-medium transition flex items-center gap-1 border border-slate-300">
            📝 Markdown
          </button>

          <!-- PDF Export -->
          <button @click="exportPDF" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-3 py-2 rounded-lg font-medium transition flex items-center gap-1 shadow-sm">
            🖨️ PDF / Drucken
          </button>

          <button @click="leaveRoom" class="text-xs text-red-600 hover:underline ml-2">Verlassen</button>
        </div>
      </header>

      <!-- MATRIX-TABELLE -->
      <div class="overflow-x-auto bg-white rounded-xl shadow-sm border border-slate-200 p-4 print-border">
        <table class="w-full border-collapse">
          <thead>
            <tr>
              <th class="p-3 bg-slate-50 border border-slate-200 text-left w-64">
                <div class="font-bold text-slate-700 text-sm">Optionen & Akteure</div>
              </th>
              
              <!-- Akteurs-Köpfe -->
              <th v-for="(actor, aIdx) in mapData.actors" :key="aIdx" class="p-3 bg-slate-50 border border-slate-200 text-left min-w-[240px] align-top">
                <div class="flex items-center justify-between mb-2">
                  <input v-model="actor.name" @input="sync" placeholder="Akteur..." class="font-bold text-slate-800 bg-transparent border-b border-transparent focus:border-indigo-500 outline-none w-full text-sm">
                  <button @click="removeActor(aIdx)" class="text-slate-400 hover:text-red-500 text-xs no-print ml-1">✕</button>
                </div>
                
                <input v-model="actor.perspective" @input="sync" placeholder="Perspektive..." class="text-xs w-full mb-1 px-1.5 py-0.5 border rounded border-slate-200">
                <input v-model="actor.scope" @input="sync" placeholder="Handlungsspielraum..." class="text-xs w-full mb-2 px-1.5 py-0.5 border rounded border-slate-200">

                <!-- Werte / Tags -->
                <div class="flex flex-wrap gap-1 items-center">
                  <span v-for="(val, vIdx) in actor.values" :key="vIdx" class="text-[10px] bg-slate-200 text-slate-700 px-1.5 py-0.5 rounded flex items-center gap-1">
                    {{ val }}
                    <button @click="removeValue(actor, vIdx)" class="no-print hover:text-red-600">×</button>
                  </span>
                  <input @keyup.enter="addValue(actor, $event)" placeholder="+ Wert" class="text-[10px] border border-dashed border-slate-300 rounded px-1.5 py-0.5 w-16 outline-none no-print">
                </div>
              </th>

              <!-- Akteur hinzufügen Spalte (im Druck unsichtbar) -->
              <th class="p-3 bg-slate-50 border border-slate-200 text-center w-12 no-print">
                <button @click="addActor" class="text-indigo-600 hover:bg-indigo-50 w-8 h-8 rounded-full border border-indigo-200 font-bold">+</button>
              </th>
            </tr>
          </thead>

          <tbody>
            <!-- Optionen-Zeilen -->
            <tr v-for="(opt, oIdx) in mapData.options" :key="oIdx">
              <td class="p-3 border border-slate-200 bg-slate-50/50 align-top">
                <div class="flex items-center justify-between mb-1">
                  <input v-model="opt.title" @input="sync" placeholder="Option..." class="font-bold text-sm text-slate-800 bg-transparent border-b border-transparent focus:border-indigo-500 outline-none w-full">
                  <button @click="removeOption(oIdx)" class="text-slate-400 hover:text-red-500 text-xs no-print ml-1">✕</button>
                </div>
                <textarea v-model="opt.description" @input="sync" placeholder="Umsetzungsdetails..." class="text-xs w-full p-1.5 border border-slate-200 rounded resize-y min-h-[50px] outline-none"></textarea>
              </td>

              <!-- Zellen (Bewertungskriterien) -->
              <td v-for="(actor, aIdx) in mapData.actors" :key="aIdx" class="p-2 border border-slate-200 align-top bg-white">
                <div class="space-y-1.5">
                  <div v-for="(item, iIdx) in getCellItems(opt.id, actor.id)" :key="iIdx" class="flex items-start gap-1 group">
                    <button @click="cycleSymbol(item)" class="text-xs font-bold px-1.5 py-0.5 rounded transition shrink-0"
                      :class="{
                        'bg-emerald-100 text-emerald-800': item.symbol === '+',
                        'bg-amber-100 text-amber-800': item.symbol === '-',
                        'bg-red-100 text-red-800': item.symbol === '!'
                      }">
                      {{ item.symbol }}
                    </button>
                    <input v-model="item.text" @input="sync" placeholder="Argument..." class="text-xs w-full border-b border-transparent focus:border-slate-300 outline-none px-1">
                    <button @click="removeItem(opt.id, actor.id, iIdx)" class="opacity-0 group-hover:opacity-100 text-slate-400 hover:text-red-500 text-xs no-print">×</button>
                  </div>
                  <button @click="addItem(opt.id, actor.id)" class="text-[11px] text-slate-400 hover:text-indigo-600 no-print block pt-1">+ Argument</button>
                </div>
              </td>

              <td class="border border-slate-200 bg-slate-50/50 no-print"></td>
            </tr>

            <!-- Option hinzufügen Zeile -->
            <tr class="no-print">
              <td :colspan="mapData.actors.length + 2" class="p-2 bg-slate-50 border border-slate-200 text-center">
                <button @click="addOption" class="text-indigo-600 hover:underline text-xs font-semibold">+ Neue Option hinzufügen</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- ABSCHLIESSENDES URTEIL -->
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 print-border">
        <h2 class="text-base font-bold text-slate-800 mb-2">⚖️ Abschließendes Urteil / Güterabwägung</h2>
        <textarea v-model="mapData.judgement" @input="sync" placeholder="Formuliere hier das begründete Urteil..." class="w-full p-3 border border-slate-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-500 min-h-[100px]"></textarea>
      </div>

    </div>
  </div>

  <script>
    const { createApp, ref } = Vue;

    createApp({
      setup() {
        const currentRoom = ref('');
        const roomInput = ref('');
        let socket = null;

        const defaultData = () => ({
          options: [{ id: 'opt_1', title: 'Option A', description: 'Beispieloption...' }],
          actors: [{ id: 'act_1', name: 'Nutzer:innen', perspective: 'Datensouveränität', scope: 'Nutzungsverhalten', values: ['Privatsphäre'] }],
          matrix: {}, // key: "optId_actorId", value: [{symbol: '+', text: '...'}]
          judgement: ''
        });

        const mapData = ref(defaultData());

        const joinRoom = (room) => {
          if (!room) return;
          currentRoom.value = room.toUpperCase().trim();
          
          const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
          socket = new WebSocket(`${protocol}//${window.location.host}/ws/${currentRoom.value}`);

          socket.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data && data.options) {
              mapData.value = data;
            }
          };
        };

        const createRandomRoom = () => {
          const rand = 'MAP-' + Math.floor(1000 + Math.random() * 9000);
          joinRoom(rand);
        };

        const sync = () => {
          if (socket && socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify(mapData.value));
          }
        };

        const leaveRoom = () => {
          if (socket) socket.close();
          currentRoom.value = '';
          mapData.value = defaultData();
        };

        // MATRIX-HELPER
        const getCellItems = (optId, actId) => {
          const key = `${optId}_${actId}`;
          if (!mapData.value.matrix[key]) {
            mapData.value.matrix[key] = [];
          }
          return mapData.value.matrix[key];
        };

        const addItem = (optId, actId) => {
          const items = getCellItems(optId, actId);
          items.push({ symbol: '+', text: '' });
          sync();
        };

        const removeItem = (optId, actId, idx) => {
          getCellItems(optId, actId).splice(idx, 1);
          sync();
        };

        const cycleSymbol = (item) => {
          const syms = ['+', '-', '!'];
          let nextIdx = (syms.indexOf(item.symbol) + 1) % syms.length;
          item.symbol = syms[nextIdx];
          sync();
        };

        const addOption = () => {
          mapData.value.options.push({ id: 'opt_' + Date.now(), title: 'Neue Option', description: '' });
          sync();
        };

        const removeOption = (idx) => {
          mapData.value.options.splice(idx, 1);
          sync();
        };

        const addActor = () => {
          mapData.value.actors.push({ id: 'act_' + Date.now(), name: 'Neuer Akteur', perspective: '', scope: '', values: [] });
          sync();
        };

        const removeActor = (idx) => {
          mapData.value.actors.splice(idx, 1);
          sync();
        };

        const addValue = (actor, evt) => {
          const val = evt.target.value.trim();
          if (val) {
            actor.values.push(val);
            evt.target.value = '';
            sync();
          }
        };

        const removeValue = (actor, idx) => {
          actor.values.splice(idx, 1);
          sync();
        };

        // --- EXPORT & IMPORT FUNKTIONEN ---

        // 1. JSON-Backup exportieren
        const exportJsonBackup = () => {
          const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(mapData.value, null, 2));
          const dlAnchorElem = document.createElement('a');
          dlAnchorElem.setAttribute("href", dataStr);
          dlAnchorElem.setAttribute("download", `autonomy_map_${currentRoom.value}.json`);
          dlAnchorElem.click();
        };

        // 2. JSON-Backup importieren
        const importJsonBackup = (event) => {
          const file = event.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (e) => {
            try {
              const imported = JSON.parse(e.target.result);
              if (imported.options && imported.actors) {
                mapData.value = imported;
                sync();
                alert('Backup erfolgreich wiederhergestellt!');
              } else {
                alert('Ungültige Autonomy-Map-Datei.');
              }
            } catch (err) {
              alert('Fehler beim Lesen der Datei.');
            }
          };
          reader.readAsText(file);
          event.target.value = ''; // Reset file input
        };

        // 3. Markdown Export
        const exportMarkdown = () => {
          let md = `# 🧭 Autonomy Map (Raum: ${currentRoom.value})\n\n`;

          md += `## 👥 Akteure\n`;
          mapData.value.actors.forEach(a => {
            md += `* **${a.name || 'Unbenannt'}**\n`;
            md += `  * Perspektive: ${a.perspective || '-'}\n`;
            md += `  * Handlungsspielraum: ${a.scope || '-'}\n`;
            md += `  * Werte: ${a.values.join(', ') || '-'}\n`;
          });
          md += `\n---\n\n`;

          md += `## 📊 Bewertungsmatrix\n\n`;
          mapData.value.options.forEach(opt => {
            md += `### Option: ${opt.title || 'Unbenannt'}\n`;
            if (opt.description) md += `*Beschreibung: ${opt.description}*\n\n`;

            mapData.value.actors.forEach(a => {
              const items = getCellItems(opt.id, a.id);
              md += `#### Akteur: ${a.name || 'Unbenannt'}\n`;
              if (items.length === 0) {
                md += `* *Keine Kriterien eingetragen*\n`;
              } else {
                items.forEach(it => {
                  const label = it.symbol === '+' ? '[+] Chance' : it.symbol === '-' ? '[-] Risiko' : '[!] Veto';
                  md += `* **${label}:** ${it.text}\n`;
                });
              }
              md += `\n`;
            });
            md += `---\n\n`;
          });

          md += `## ⚖️ Abschließendes Urteil\n\n`;
          md += `${mapData.value.judgement || '*Noch kein Urteil formuliert.*'}\n`;

          const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
          const dlAnchorElem = document.createElement('a');
          dlAnchorElem.setAttribute("href", URL.createObjectURL(blob));
          dlAnchorElem.setAttribute("download", `autonomy_map_${currentRoom.value}.md`);
          dlAnchorElem.click();
        };

        // 4. PDF Druck
        const exportPDF = () => {
          window.print();
        };

        return {
          currentRoom,
          roomInput,
          mapData,
          joinRoom,
          createRandomRoom,
          leaveRoom,
          sync,
          getCellItems,
          addItem,
          removeItem,
          cycleSymbol,
          addOption,
          removeOption,
          addActor,
          removeActor,
          addValue,
          removeValue,
          exportJsonBackup,
          importJsonBackup,
          exportMarkdown,
          exportPDF
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
